name: Scheduled Facebook Post

on:
  schedule:
    # GitHub Actions frequently delays scheduled runs by hours. Run early so a
    # delayed run still lands on the same calendar day in VN time (UTC+7) — a run
    # after 17:00 UTC is already "tomorrow" in Vietnam and finds no post.
    - cron: "0 4 * * 1,3,5" # 04:00 UTC = 11:00 VN, Mon/Wed/Fri — primary
    - cron: "0 9 * * 1,3,5" # 09:00 UTC = 16:00 VN — fallback if the primary run was dropped
  workflow_dispatch:
    inputs:
      date:
        description: "Post date to publish (YYYY-MM-DD). Leave empty to use today (VN time)."
        required: false
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node src/index.js ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      - name: Commit "posted" status back to the calendar
        run: |
          if ! git diff --quiet content/calendar.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/calendar.json
            git commit -m "chore: mark post as posted [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-images
          path: output/
          if-no-files-found: ignore
