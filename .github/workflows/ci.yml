name: CI

# Runs the test suite on push to develop, on PRs against develop, or manually.
# Separate from the scheduled-post job so a render regression (especially the
# ffmpeg Reel pipeline) is caught here, well before a cron run tries to publish.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No system ffmpeg/ffprobe check here: ubuntu-latest doesn't ship them
      # preinstalled (see #21), and resolveFfmpeg()/resolveFfprobe() in
      # src/reel.js already fall back to the bundled ffmpeg-static/
      # ffprobe-static binaries when neither is on PATH — the same binaries
      # `npm test`'s real Reel-render tests exercise below.
      - run: npm ci
      - run: npm test
